name: Build Windows x64

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone JUCE 8.0.9
        run: git clone --depth 1 --branch 8.0.9 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build Release (VST3 & Standalone)
        run: cmake --build build --config Release -- /nr:false /m:1

      - name: Package Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "build/SDVerb_artefacts/Release/VST3/SD-Verb.vst3" -Destination "dist/SD-Verb.vst3" -Recurse
          Copy-Item -Path "build/SDVerb_artefacts/Release/Standalone/SD-Verb.exe" -Destination "dist/SD-Verb.exe"
          Copy-Item -Path "LICENSE" -Destination "dist/LICENSE"
          Compress-Archive -Path "dist/*" -DestinationPath "SD-Verb-Windows-x64.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SD-Verb-Windows-x64
          path: SD-Verb-Windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SD-Verb-Windows-x64.zip
